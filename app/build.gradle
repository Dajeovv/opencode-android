plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opencode.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.opencode.launcher"
        minSdk 26
        targetSdk 34
        versionCode 157
        versionName "3.127"
    }

    // Firma release: lee keystore.properties (no versionado). Sin ese fichero,
    // el debug compila igual; el release pedirá el keystore.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file("keystore.properties")
    if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
}
