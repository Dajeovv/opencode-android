plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opencode.launcher'
    compileSdk 34

    defaultConfig {
        // Paquete propio de la app v2: convive instalada con la v1 (.next).
        // Ya no es un "launcher": el id publico es com.opencode.android.
        applicationId "com.opencode.android"
        minSdk 26
        targetSdk 34
        versionCode 174
        versionName "5.0.0"
        buildConfigField "int", "SERVER_PORT", "4099"
        // Version del binario empaquetado en jniLibs. Actualizarla al cambiarlo.
        buildConfigField "String", "OPENCODE_VERSION", "\"2.2.0\""
        // v2: runtime 2.x con la UI nueva (viewport, service worker, avisos).
        buildConfigField "boolean", "V2", "true"
        // Aislamiento del laboratorio. En la app real va en false: updates
        // del launcher y auto-permisos activos.
        buildConfigField "boolean", "V2_LAB", "false"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Firma release: lee keystore.properties (no versionado). Sin ese fichero,
    // el debug compila igual; el release pedirÃ¡ el keystore.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file("keystore.properties")
    if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        // App 5.x: RC con la clave de release y el paquete definitivo.
        beta {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField "int", "SERVER_PORT", "4099"
            signingConfig signingConfigs.release
        }
        // Build de pruebas separado para no tocar la app instalada.
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "int", "SERVER_PORT", "4100"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Descompresion xz en Java: Android no trae el binario xz y el tar de
    // Toybox lo necesita para los .deb de Termux.
    implementation 'org.tukaani:xz:1.10'
}
