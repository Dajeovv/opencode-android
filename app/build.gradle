plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opencode.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.opencode.launcher"
        minSdk 26
        targetSdk 34
        versionCode 174
        versionName "4.0.2"
        buildConfigField "int", "SERVER_PORT", "4096"
        // Version del binario empaquetado en jniLibs. Actualizarla al cambiarlo.
        buildConfigField "String", "OPENCODE_VERSION", "\"1.19.4\""
        // v1: canal 4.x del launcher y runtime opencode 1.x.
        buildConfigField "boolean", "V2", "false"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Firma release: lee keystore.properties (no versionado). Sin ese fichero,
    // el debug compila igual; el release pedirÃ¡ el keystore.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file("keystore.properties")
    if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        // App 4.0.x (Next): runtime embebido, sin Termux, con paquete aparte.
        // Se firma con la clave de release.
        beta {
            initWith release
            matchingFallbacks = ['release']
            applicationIdSuffix ".next"
            buildConfigField "int", "SERVER_PORT", "4098"
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".next"
            versionNameSuffix "-next"
            buildConfigField "int", "SERVER_PORT", "4098"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Descompresion xz en Java: Android no trae el binario xz y el tar de
    // Toybox lo necesita para los .deb de Termux.
    implementation 'org.tukaani:xz:1.10'
}
